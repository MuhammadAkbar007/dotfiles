[colors]
background      = #BF1E1E2E
background-alt   = #313244
foreground      = #cdd6f4
disabled         = #6c7086
accent           = #df8e1d
red              = #f38ba8
green            = #40a02b
mauve            = #cba6f7
blue             = #89b4fa
purple           = #8839ef
yellow           = #f9e2af
overlay          = #acb0be
urgent           = #e64553

[bar/example]
; Set by polybar_launcher.sh, one bar per connected output. Empty = primary.
monitor = ${env:MONITOR:}
width = 100%
height = 30pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 5pt

padding-left = 1
padding-right = 1
module-margin = 1
separator =
separator-foreground = ${colors.disabled}

; Ubuntu Nerd Font carries both text + icon glyphs.
; <name>;<vertical-offset>
font-0 = Ubuntu Nerd Font:weight=bold:size=13;3
font-1 = Ubuntu Nerd Font:weight=bold:size=15;3
font-2 = Ubuntu Nerd Font:weight=bold:size=12;3
; Color-emoji fallback for the clipboard label. Twemoji Mozilla is a COLR/CPAL
; *vector* color font (copied from firefox-esr), so cairo renders it in full
; color AND scales it to the bar size. Noto Color Emoji couldn't be used: it's a
; fixed bitmap strike that polybar can't scale (rendered huge & clipped).
font-3 = Twemoji Mozilla:size=13;3
; Bold-italic Ubuntu Nerd Font — used by the mpris module to italicise the song
; title while paused (polybar has no inline italic tag; only %{T..} font
; switching). %{T5} selects this (T1=font-0 .. T5=font-4).
font-4 = Ubuntu Nerd Font:weight=bold:slant=italic:size=13;3

modules-left = i3 pomodoro mpris
modules-center = date
modules-right = clipboard pulseaudio network power caffeine systray prayer

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false

; Same bar, minus systray. The X11 systray protocol only lets ONE bar own the
; tray (first to grab the manager selection wins), and polybar_launcher.sh
; decides which monitor that is (external if connected, else laptop) and
; launches every other monitor with this variant instead, so a second copy of
; the tray icons doesn't fight for the selection on the other screen.
[bar/example-notray]
inherit = bar/example
modules-right = clipboard pulseaudio network power caffeine prayer

;==========================================================
; Clipboard (copyq) — last item; click = history, right-click = wipe
; Event-driven (no interval): copyq's "Polybar refresh" automatic command runs
;   polybar-msg action "#clipboard.hook.0"
; on every new clipboard entry, which re-runs hook-0. `initial = 1` draws it
; once on bar start. clip-show.sh does its own truncation, so no label-maxlen.
;==========================================================
[module/clipboard]
type = custom/ipc
hook-0 = ~/.config/i3/clipboard/clip-show.sh
initial = 1
format = <output>
format-prefix = "󰅍 "
format-prefix-foreground = ${colors.mauve}
format-foreground = ${colors.disabled}
click-left = ~/.config/i3/clipboard/clip-menu.sh
click-right = ~/.config/i3/clipboard/clip-clear.sh

;==========================================================
; Workspaces
;==========================================================
; internal/i3, not internal/xworkspaces: the latter renders in
; _NET_DESKTOP_NAMES order (creation order, grouped per monitor), so a
; workspace opened later on the second screen jumps to the front of the bar.
; index-sort exists only on internal/i3.
[module/i3]
type = internal/i3
index-sort = true
; false = every bar lists every workspace. Flip to true for per-monitor bars.
pin-workspaces = false
enable-click = true
enable-scroll = false

; Static per-workspace app icons. The text BEFORE the ';' is matched against
; the workspace name (exact match: "1".."10"), the text AFTER is the glyph.
; All glyphs are Material Design (nf-md-*) so they render in Ubuntu Nerd Font.
; To change a workspace's icon, swap the glyph after its ';'.
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;󰊠
ws-icon-4 = 5;
ws-icon-5 = 6;󱚝
ws-icon-6 = 7;󰕧
ws-icon-7 = 8;󱡓
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default = 󰊠

label-focused = %name% %icon%
label-focused-foreground = ${colors.accent}
label-focused-padding = 2

; Focused on the *other* monitor.
label-visible = %name% %icon%
label-visible-foreground = ${colors.overlay}
label-visible-padding = 2

label-unfocused = %name% %icon%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-urgent = %icon% %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 2

;==========================================================
; MPRIS now-playing (replaces waybar's `mpris`). Script streams playerctl.
; click = play/pause, scroll = next/prev. No rounded pill (polybar can't do
; per-module border-radius), so it's a plain colored label.
;==========================================================
[module/mpris]
type = custom/script
exec = ~/.config/polybar/mpris.sh
interval = 1
format-padding = 1
format-margin = 1
; Controls go through the script so they act on the player the label shows
; (the active one), not on whatever player happens to be first on D-Bus.
click-left = ~/.config/polybar/mpris.sh play-pause
click-right = ~/.config/polybar/mpris.sh next
click-middle = ~/.config/polybar/mpris.sh previous
; Scroll swaps which player the module shows when several are paused (switch
; source only — left-click then resumes the newly-shown one).
scroll-up = ~/.config/polybar/mpris.sh cycle
scroll-down = ~/.config/polybar/mpris.sh cycle-prev
; Title length + ellipsis are handled inside mpris.sh (MAXLEN=45). polybar's
; label-maxlen is intentionally NOT set here: it counts the %{F..}/%{T..} colour
; & font markup against the limit, which made the paused title (extra markup)
; truncate shorter than the playing one. Letting the script own truncation keeps
; both states an equal 45 visible characters.

;==========================================================
; Clock / date  (center)  — no interactive calendar in polybar
;==========================================================
[module/date]
type = internal/date
interval = 1

date = "   %a %d %B | 󰅐 %H:%M"

label = %date%
label-foreground = ${colors.foreground}
format-padding = 1

;==========================================================
; Pulseaudio
;==========================================================
; internal/pulseaudio can't pick an icon from the active *port* (speaker vs
; headphone), so we use a script that watches pactl and swaps the glyph.
[module/pulseaudio]
type = custom/script
exec = ~/.config/polybar/pulseaudio.sh
tail = true
format = <label>
label = %output%

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol
click-middle = blueman-manager
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +2%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -2%

;==========================================================
; Network — wifi signal icon
;==========================================================
[module/network]
type = internal/network
interface-type = wireless
interval = 5

; Click actions are embedded in the format (internal modules don't reliably
; honor the generic click-left). A1 = left -> network applet, A3 = right -> nmtui.
format-connected = %{A1:/home/akbar/.config/rofi/network/network.sh:}%{A3:kitty -e nmtui:}<ramp-signal>%{A}%{A}
; format-connected = | %{A1:/home/akbar/.config/rofi/network/network.sh:}%{A3:kitty -e nmtui:}<ramp-signal> <label-connected>%{A}%{A}
format-connected-foreground = ${colors.purple}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

format-disconnected = %{A1:/home/akbar/.config/rofi/network/network.sh:}%{A3:kitty -e nmtui:}<label-disconnected>%{A}%{A}
format-disconnected-foreground = ${colors.red}
label-disconnected = 󰤮
label-connected = %essid%
label-maxlen = 33
label-connected-foreground = ${colors.purple}

;==========================================================
; Backlight
;==========================================================
[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-foreground = ${colors.yellow}
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

;==========================================================
; Pomodoro (pet project). Bar text + timer are portable; the break OVERLAY is
; Wayland-only (GTK Layer Shell) and is handled separately. The script streams
; pomodoro.py's JSON; clicks drive pomodoroctl.py.
;   click-left = start/pause   click-right = next/break   click-middle = reset
;==========================================================
[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/pomodoro.sh
tail = true
format-padding = 1
format-margin = 2
click-left = python3 /home/akbar/akbarDev/pet-projects/pomodoro/pomodoroctl.py toggle
click-right = python3 /home/akbar/akbarDev/pet-projects/pomodoro/pomodoroctl.py next
click-middle = python3 /home/akbar/akbarDev/pet-projects/pomodoro/pomodoroctl.py reset

;==========================================================
; Caffeine / idle inhibitor
;==========================================================
[module/caffeine]
type = custom/script
exec = ~/.config/polybar/caffeine.sh
interval = 1
click-left = ~/.config/polybar/caffeine.sh toggle

;==========================================================
; Prayer times (namozvaqti) — same data source as the waybar custom/prayer.
; The label is the JSON `.text`; polybar has no tooltip, so click opens the
; full times table in a kitty popup (the waybar `.tooltip` equivalent).
;==========================================================
[module/prayer]
type = custom/script
exec = ~/.config/polybar/prayer.sh
interval = 60
format-foreground = ${colors.accent}
format-padding = 1
click-left = kitty -e ~/.config/polybar/prayer_popup.sh

;==========================================================
; Power menu (rofi) TODO: add icons or firefox bookmark
;==========================================================
[module/power]
type = custom/text
format = ⏻
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.config/rofi/powermenu/powermenu.sh

;==========================================================
; System tray
;==========================================================
[module/systray]
type = internal/tray
format-margin = 1pt
tray-spacing = 5pt
tray-size = 50%

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
